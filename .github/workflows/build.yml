name: build-apk
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: 寫入專案檔案
        run: |
          mkdir -p app/src/main/java/com/deshi/app app/src/main/res/xml
          cat > settings.gradle.kts <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "deshi"
          include(":app")
          EOF
          cat > app/build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application") version "8.5.2"
              id("org.jetbrains.kotlin.android") version "1.9.24"
          }
          android {
              namespace = "com.deshi.app"
              compileSdk = 34
              defaultConfig {
                  applicationId = "com.deshi.app"
                  minSdk = 24
                  targetSdk = 34
                  versionCode = 1
                  versionName = "1.0"
              }
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
              kotlinOptions {
                  jvmTarget = "17"
              }
          }
          EOF
          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <application android:label="的是機" android:allowBackup="false">
                  <activity android:name=".MainActivity" android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
                  <service
                      android:name=".DeshiService"
                      android:exported="true"
                      android:label="的是機"
                      android:permission="android.permission.BIND_ACCESSIBILITY_SERVICE">
                      <intent-filter>
                          <action android:name="android.accessibilityservice.AccessibilityService" />
                      </intent-filter>
                      <meta-data
                          android:name="android.accessibilityservice"
                          android:resource="@xml/accessibility_config" />
                  </service>
              </application>
          </manifest>
          EOF
          cat > app/src/main/res/xml/accessibility_config.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <accessibility-service xmlns:android="http://schemas.android.com/apk/res/android"
              android:accessibilityEventTypes="typeViewTextChanged"
              android:accessibilityFeedbackType="feedbackGeneric"
              android:canRetrieveWindowContent="true"
              android:notificationTimeout="50" />
          EOF
          cat > app/src/main/java/com/deshi/app/Main.kt <<'EOF'
          package com.deshi.app

          import android.accessibilityservice.AccessibilityService
          import android.app.Activity
          import android.content.Context
          import android.content.Intent
          import android.os.Bundle
          import android.provider.Settings
          import android.view.accessibility.AccessibilityEvent
          import android.view.accessibility.AccessibilityNodeInfo
          import android.widget.Button
          import android.widget.EditText
          import android.widget.LinearLayout
          import android.widget.ScrollView
          import android.widget.Switch
          import android.widget.TextView
          import android.widget.Toast

          object Cfg {
              fun sp(c: Context) = c.getSharedPreferences("cfg", Context.MODE_PRIVATE)
              fun suffix(c: Context): String = sp(c).getString("suffix", "的是") ?: "的是"
              fun ends(c: Context): String = sp(c).getString("ends", "。！？!?") ?: "。！？!?"
              fun on(c: Context): Boolean = sp(c).getBoolean("on", true)
          }

          class MainActivity : Activity() {
              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  val pad = (16 * resources.displayMetrics.density).toInt()
                  val root = LinearLayout(this)
                  root.orientation = LinearLayout.VERTICAL
                  root.setPadding(pad, pad, pad, pad)
                  val scroll = ScrollView(this)
                  scroll.addView(root)
                  setContentView(scroll)

                  fun label(t: String): TextView {
                      val v = TextView(this)
                      v.text = t
                      v.textSize = 15f
                      v.setPadding(0, pad, 0, pad / 3)
                      return v
                  }

                  root.addView(label("1. 先開啟無障礙服務（找到「的是機」打開）"))
                  val openBtn = Button(this)
                  openBtn.text = "打開無障礙設定"
                  openBtn.setOnClickListener { startActivity(Intent(Settings.ACTION_ACCESSIBILITY_SETTINGS)) }
                  root.addView(openBtn)

                  root.addView(label("2. 句尾要加的字"))
                  val suffixEdit = EditText(this)
                  suffixEdit.setText(Cfg.suffix(this))
                  suffixEdit.setSingleLine()
                  root.addView(suffixEdit)

                  root.addView(label("3. 打到這些標點時觸發（直接寫在一起）"))
                  val endsEdit = EditText(this)
                  endsEdit.setText(Cfg.ends(this))
                  endsEdit.setSingleLine()
                  root.addView(endsEdit)

                  val sw = Switch(this)
                  sw.text = "啟用"
                  sw.isChecked = Cfg.on(this)
                  root.addView(sw)

                  val save = Button(this)
                  save.text = "儲存"
                  save.setOnClickListener {
                      Cfg.sp(this).edit()
                          .putString("suffix", suffixEdit.text.toString())
                          .putString("ends", endsEdit.text.toString())
                          .putBoolean("on", sw.isChecked)
                          .apply()
                      Toast.makeText(this, "已儲存", Toast.LENGTH_SHORT).show()
                  }
                  root.addView(save)
              }
          }

          class DeshiService : AccessibilityService() {
              override fun onAccessibilityEvent(e: AccessibilityEvent?) {
                  if (e == null || e.eventType != AccessibilityEvent.TYPE_VIEW_TEXT_CHANGED) return
                  if (!Cfg.on(this)) return
                  if (e.packageName?.toString() == packageName) return
                  val node = e.source ?: return
                  if (node.isPassword || !node.isEditable) return
                  val text = node.text?.toString() ?: return
                  val suffix = Cfg.suffix(this)
                  val ends = Cfg.ends(this)
                  if (suffix.isEmpty() || ends.isEmpty()) return
                  val added = e.addedCount
                  if (added < 1 || added > 30) return
                  val end = if (e.fromIndex >= 0 && e.fromIndex + added <= text.length) {
                      e.fromIndex + added - 1
                  } else {
                      text.length - 1
                  }
                  if (end < 1 || end >= text.length || text[end] !in ends) return
                  val before = text.substring(0, end)
                  val prev = before.last()
                  if (prev in ends || prev == '\n' || prev == ' ' || before.endsWith(suffix)) return
                  val newText = before + suffix + text.substring(end)
                  val args = Bundle()
                  args.putCharSequence(AccessibilityNodeInfo.ACTION_ARGUMENT_SET_TEXT_CHARSEQUENCE, newText)
                  if (node.performAction(AccessibilityNodeInfo.ACTION_SET_TEXT, args)) {
                      val pos = end + suffix.length + 1
                      val sel = Bundle()
                      sel.putInt(AccessibilityNodeInfo.ACTION_ARGUMENT_SELECTION_START_INT, pos)
                      sel.putInt(AccessibilityNodeInfo.ACTION_ARGUMENT_SELECTION_END_INT, pos)
                      node.performAction(AccessibilityNodeInfo.ACTION_SET_SELECTION, sel)
                  }
              }

              override fun onInterrupt() {}
          }
          EOF
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: 編譯
        run: gradle assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: deshi-apk
          path: app/build/outputs/apk/debug/app-debug.apk
